<svg xmlns="http://www.w3.org/2000/svg" viewBox="380 20 840 409">

  <defs>
    <linearGradient id="titleLight" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="titleDark" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title{
      font-family: Inter,Segoe UI,sans-serif;
      font-size:72px;
      font-weight:900;
      fill:url(#titleLight);
      letter-spacing:2px;
    }

    .subtitle{
      font-family: Inter,Segoe UI,sans-serif;
      font-size:28px;
      fill:#475569;
      letter-spacing:4px;
    }

    .badge{
      font-family: Inter,Segoe UI,sans-serif;
      font-size:20px;
      font-weight:700;
      fill:#334155;
    }

    .cloud{
      fill:url(#cloudGrad);
      opacity:.15;
      stroke:url(#cloudGrad);
      stroke-width:2;
    }

    @media (prefers-color-scheme: dark){
      .title{
        fill:url(#titleDark);
      }
      .subtitle{
        fill:#cbd5e1;
      }
      .badge{
        fill:#e2e8f0;
      }
    }
  </style>

  <g transform="translate(-140, 15)">
    <path
      class="cloud"
      filter="url(#glow)"
      d="
      M760 220
      C760 180 810 165 850 180
      C880 140 960 140 990 190
      C1040 180 1080 210 1080 255
      C1130 260 1150 300 1120 330
      L820 330
      C780 320 750 290 760 220
      Z
      "
    />

    <g opacity=".85">
      <rect x="830" y="220" width="55" height="35" rx="5" fill="#3b82f6"/>
      <rect x="900" y="245" width="70" height="40" rx="5" fill="#6366f1"/>
      <rect x="980" y="215" width="50" height="30" rx="5" fill="#8b5cf6"/>
      <rect x="1020" y="260" width="45" height="28" rx="5" fill="#3b82f6"/>

      <text x="845" y="243" fill="white" font-size="12" font-family="sans-serif">MP4</text>
      <text x="917" y="270" fill="white" font-size="12" font-family="sans-serif">MKV</text>
      <text x="992" y="235" fill="white" font-size="12" font-family="sans-serif">H265</text>
      <text x="1031" y="278" fill="white" font-size="12" font-family="sans-serif">AVI</text>
    </g>
  </g>

  <text x="800" y="90" text-anchor="middle" class="title">SUBHASISH ENCODER</text>

  <text x="800" y="135" text-anchor="middle" class="subtitle">Advanced Telegram Video Compressor</text>

  <g transform="translate(800, 395)" text-anchor="middle">
    <rect x="-175" y="-15" width="150" height="30" rx="5" fill="#1d3557" stroke="#336699"/>
    <circle cx="-160" cy="0" r="3.5" class="capsule-dot" fill="#ffffff" />
    <text x="-93" y="5" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">LATEST DOCKER</text>

    <rect x="27" y="-15" width="150" height="30" rx="5" fill="#1d3557" stroke="#336699"/>
    <circle cx="40" cy="0" r="3.5" class="capsule-dot" fill="#ffffff" />
    <text x="108" y="5" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">100% DMCA SAFE</text>
  </g>

</svg>